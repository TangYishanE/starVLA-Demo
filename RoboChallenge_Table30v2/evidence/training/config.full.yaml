run_id: robochallenge_table30v2_qwenoft_shred_paper_100step
run_root_dir: ./playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_robochallenge_table30v2
is_debug: false
version_id: '0.21'
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 8
    action_hidden_dim: 1024
    future_action_window_size: 7
    past_action_window_size: 0
    state_dim: 7
    action_horizon: 8
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/RoboChallenge_table30v2
    data_mix: robochallenge_table30v2_shred_paper
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    delete_pause_frame: false
    video_backend: torchvision_av
trainer:
  max_train_steps: 100
  num_warmup_steps: 10
  save_interval: 100
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 5
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
config_yaml: ./examples/realRobots/RoboChallenge_table30v2/train_files/starvla_qwenoft_robochallenge_table30v2.yaml
output_dir: ./playground/Checkpoints/robochallenge_table30v2_qwenoft_shred_paper_100step
