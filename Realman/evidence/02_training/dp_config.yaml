datasets:
  vla_data:
    action_mode: abs
    action_mode_apply_keys:
    - action.delta_joints
    data_mix: realman_example_dp
    data_root_dir: playground/Datasets/Realman/lerobot
    dataset_py: lerobot_datasets
    per_device_batch_size: 1
    video_backend: torchvision_av
framework:
  action_dim: 8
  cond_predict_scale: true
  diffusion_step_embed_dim: 256
  down_dims:
  - 256
  - 512
  - 1024
  horizon: 16
  image_keys:
  - cam0_rgb
  - cam1_rgb
  image_size:
  - 224
  - 224
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  name: DiffusionPolicy
  num_inference_steps: null
  num_train_timesteps: 100
  obs_as_global_cond: true
  pretrained_backbone: true
  state_dim: 8
output_dir: ./results/Checkpoints/realman_dp_smoke
run_id: realman_dp_smoke
run_root_dir: ./results/Checkpoints
seed: 42
trainer:
  eval_interval: 100000
  freeze_modules: ''
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 2.5e-05
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 100
  num_warmup_steps: 200
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_interval: 100
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
